services:
  postgres:
    image: postgres:16
    container_name: task_runner_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: task_runner
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d task_runner"]
      interval: 5s
      timeout: 5s
      retries: 5  

volumes:
  postgres_data:
